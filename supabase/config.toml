# Función llamada exclusivamente por Supabase Cron con clave secreta en apikey.
# verify_jwt=false porque los secretos sb_secret_* NO son JWT.
# @supabase/server con auth:'secret' comprueba la clave ANTES del handler.
[functions.vision-daily-report]
verify_jwt = false

# Administración de usuarios desde el frontend: exige JWT real de Supabase Auth.
# Además, el handler comprueba la membresía 'administrador' en PostgreSQL.
[functions.vision-manage-users]
verify_jwt = true
