# Etapa 7 — integración continua; no usa secretos ni despliega producción.
# Vercel conserva su pipeline de despliegue independiente.
name: VISION AI - Calidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Tests / TypeScript / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias según lockfile
        run: npm ci
      - name: Preparar modelo YOLO verificado
        run: npm run model:download
      # Igual que Vercel: ambos pesos ONNX deben pasar la descarga con SHA-256.
      - name: Preparar modelo E2 de conos verificado
        run: node scripts/download-cone-model-stage8.mjs
      - name: Ejecutar pruebas
        run: npm run test
      - name: Comprobar tipos
        run: npm run typecheck
      - name: Construir para Vercel
        run: npm run build
      - name: Comprobar que Vite incluyó el modelo E2
        run: node scripts/verify-cone-release-stage8.mjs
      - name: Auditar recursos públicos y modelo ONNX
        run: npm run audit:release
